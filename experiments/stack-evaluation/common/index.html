<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Many Iris 構成比較</title><style>
:root{font-family:system-ui,sans-serif;color:#e8e9f5;background:#111526}*{box-sizing:border-box}body{margin:0 auto;max-width:960px;padding:24px}header{border-bottom:1px solid #454860;margin-bottom:24px}h1{font-size:1.8rem}input,button{font:inherit;border:1px solid #626784;border-radius:8px;padding:10px;background:#21283f;color:inherit;max-width:100%}button{cursor:pointer}button:hover{background:#353d5a}form,.actions{display:flex;gap:8px;flex-wrap:wrap}article{background:#1c2236;border-radius:12px;padding:18px;margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}#tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}#tasks button{text-align:left}small{color:#b5bbd3}#state{min-height:1.5em;color:#a6dcca}label{display:block}details{margin-top:20px}input{min-width:0}@media(max-width:500px){body{padding:16px}}
</style><header><h1>Many Iris</h1><p>構成比較用・合成データ</p><small>実案件・実AI・スマホ接続は未確認です。この画面の操作はローカル比較用です。</small></header>
<form id="connect"><label>比較用セッショントークン <input id="token" type="password" autocomplete="off" required></label><button>接続</button></form>
<p id="state" role="status" aria-live="polite">接続待ち</p><nav id="pages" class="actions" aria-label="一覧ページ"><button id="prev" hidden>前の50件</button><span id="page-info"></span><button id="next" hidden>次の50件</button></nav>
<article id="detail" hidden><h2 id="title"></h2><pre id="source"></pre><p id="run-state"></p><div class="actions"><button id="start">計画を開始</button><button id="approve">承認</button><button id="reject">却下</button><button id="execute">合成処理を実行</button><button id="stop">停止</button><button id="refresh">状態を確認</button><button id="back">一覧に戻る</button></div></article>
<section id="tasks" aria-label="合成案件一覧"></section>
<details><summary>この比較の境界</summary><p>トークンはこのページのメモリだけに保持します。原文・処理・結果はすべて架空です。承認は版・内容・期限へ結び付け、DBを復元した候補では実行を止めます。正式な認証・配布・更新の完成を示しません。</p></details>
<script>
let credential='',selected=null,run=null,pending=false;let taskRuns=new Map();try{taskRuns=new Map(JSON.parse(sessionStorage.getItem('iris-experiment-runs')||'[]'))}catch{}
let offset=0;
const el=id=>document.getElementById(id),message=text=>{el('state').textContent=text};
const labels={waiting:'承認待ち',approved:'承認済み',queued:'実行待ち',running:'実行中',completed:'完了',rejected:'却下済み',stopped:'停止済み',unknown:'結果を確認できません。再実行は保留中です',stop_unconfirmed:'停止を確認できません。再実行は保留中です'};
function remember(task,id){taskRuns.set(task,id);sessionStorage.setItem('iris-experiment-runs',JSON.stringify([...taskRuns]))}
async function api(op,fields={}){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+credential},body:JSON.stringify({op,...fields})});const value=await response.json();if(!value.ok)throw new Error(value.error||'処理を確認できません');return value.data}
async function act(fn){if(pending)return;pending=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(error){message('確認が必要: '+error.message)}finally{pending=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function status(){if(!run)return;const current=run.run_id;const task=selected.id;const response=await api('status',{run_id:current});if(selected.id!==task||run.run_id!==current)return;if(response.task_id!==task){run=null;throw Error('実行と案件が一致しません')}run=response;el('run-state').textContent='処理状態: '+(labels[run.state]||'確認が必要です')+' / 実行ID: '+current;remember(task,current);message('状態を取得しました')}
async function listPage(nextOffset){const data=await api('list',{offset:nextOffset,limit:50});offset=nextOffset;selected=null;run=null;el('detail').hidden=true;el('tasks').replaceChildren();for(const task of data.tasks){const button=document.createElement('button');button.textContent=task.title;button.onclick=()=>act(async()=>{selected=await api('detail',{task_id:task.id});run=null;el('title').textContent=selected.title;el('source').textContent=selected.source;el('run-state').textContent='未開始';el('detail').hidden=false;if(taskRuns.has(task.id)){run={run_id:taskRuns.get(task.id)};await status()}else message('原文を取得しました');el('detail').scrollIntoView({block:'start'})});el('tasks').append(button)}el('prev').hidden=offset===0;el('next').hidden=offset+data.tasks.length>=data.total;el('page-info').textContent=(data.total?offset+1:0)+'〜'+(offset+data.tasks.length)+' / '+data.total+'件';message(data.total+'件の合成案件を取得しました')}
el('connect').onsubmit=event=>{event.preventDefault();act(async()=>{credential=el('token').value;el('token').value='';await listPage(0)})};
el('prev').onclick=()=>act(()=>listPage(Math.max(0,offset-50)));el('next').onclick=()=>act(()=>listPage(offset+50));el('back').onclick=()=>{el('detail').hidden=true;selected=null;run=null;el('pages').scrollIntoView({block:'start'})};
el('start').onclick=()=>act(async()=>{const task=selected.id;const result=await api('start',{task_id:task,request_id:'ui-'+crypto.randomUUID()});if(selected.id!==task)return;run=result;remember(task,run.run_id);el('run-state').textContent='計画を保存しました / 実行ID: '+run.run_id;await status()});
el('approve').onclick=()=>act(async()=>{if(!run)throw Error('先に計画を開始してください');await api('approve',{run_id:run.run_id,revision:selected.revision,source_hash:selected.source_hash,expires_at:2000003600});await status()});
el('reject').onclick=()=>act(async()=>{if(!run)throw Error('先に計画を開始してください');await api('reject',{run_id:run.run_id});await status()});
el('execute').onclick=()=>act(async()=>{if(!run)throw Error('先に計画を開始してください');await api('enqueue',{run_id:run.run_id});await api('dispatch',{run_id:run.run_id,mode:'success'});await status()});
el('stop').onclick=()=>act(async()=>{if(!run)throw Error('先に計画を開始してください');await api('stop',{run_id:run.run_id});await status()});el('refresh').onclick=()=>act(status);
</script></html>
