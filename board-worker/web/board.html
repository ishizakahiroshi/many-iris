<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="iris-ui-token" content="__IRIS_UI_TOKEN__">
  <title>Many Iris — 看板</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/board.css">
  <script src="/board.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#board-main">看板へ移動</a>
  <header class="masthead">
    <div><p class="eyebrow">Many Iris</p><h1>案件の看板</h1><a id="board-chat-link" class="board-chat-link" href="/chat" hidden>チャットを開く →</a></div>
    <div class="mode"><span class="mode-dot" aria-hidden="true"></span><strong id="board-mode">読み取り専用</strong><span id="board-mode-note">この画面から書き込むことはできません</span></div>
  </header>
  <section class="connection-bar" aria-label="接続と情報の鮮度">
    <p id="board-status">看板を読み込んでいます…</p>
    <p id="board-observed">確認時点：未取得</p>
    <button id="board-refresh" type="button" class="quiet">読み直す</button>
  </section>
  <main id="board-main" tabindex="-1" class="board-main">
    <section id="board-pause" class="board-pause" aria-label="全部止める" hidden></section>
    <section id="board-route" class="board-route" aria-label="おまかせの順番" hidden></section>
    <section id="board-find" class="board-find" aria-label="案件で絞る・番号で探す" hidden>
      <label class="board-find-field"><span>案件</span><select id="board-project"></select></label>
      <div class="board-find-field">
        <span id="board-view-label">表示</span>
        <fieldset id="board-view" class="board-view-options" aria-labelledby="board-view-label">
          <label><input type="radio" name="view" value="cards" checked><span>カード</span></label>
          <label><input type="radio" name="view" value="list"><span>1行一覧</span></label>
          <label><input type="radio" name="view" value="gantt"><span>実績ガント</span></label>
        </fieldset>
      </div>
      <form id="board-search" class="board-find-field" role="search">
        <label for="board-search-input"><span>番号で探す</span></label>
        <input id="board-search-input" type="search" placeholder="REQ-… や項目の名前" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="quiet">探す</button>
      </form>
      <p id="board-search-status" class="board-write-status" role="status"></p>
    </section>
    <section id="board-calendar" class="board-calendar" aria-label="実績の期間" hidden>
      <div id="board-week" hidden>
        <button type="button" id="board-prev" class="quiet">前の7日</button>
        <label>表示の最終日 <input type="date" id="board-date"></label>
        <button type="button" id="board-next" class="quiet">次の7日</button>
        <button type="button" id="board-today" class="quiet">今日まで</button>
      </div>
      <p id="board-history-status" role="status"></p>
    </section>
    <div id="board-projects"><p class="empty">看板を読み込んでいます。</p></div>
    <section class="content-section" aria-labelledby="board-events-title">
      <div class="section-heading"><h2 id="board-events-title">最近の出来事</h2><span id="board-event-count" class="count">—</span></div>
      <ol id="board-events" class="board-events"></ol>
    </section>
  </main>
  <footer><span id="board-foot">Many Iris / 看板（読み取り専用）</span><span>AI の書き込みは鍵を持つ担当だけが行います。この画面は鍵を扱いません。</span></footer>
</body>
</html>
