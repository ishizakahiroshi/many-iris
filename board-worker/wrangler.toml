name = "many-iris-board"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Fetches of OAuth client metadata documents (CIMD) go only to public addresses.
compatibility_flags = ["global_fetch_strictly_public"]
# Reachable only through the custom domain added at deploy time (no workers.dev, no preview URLs).
workers_dev = false
preview_urls = false
# Custom domain: Cloudflare adds the DNS record and the certificate.
routes = [{ pattern = "iris.ishizakahiroshi.com", custom_domain = true }]

[build]
command = "node scripts/sync-web.mjs"

# The board's public origin: the OAuth issuer, and with /board/mcp the protected resource.
[vars]
BOARD_PUBLIC_ORIGIN = "https://iris.ishizakahiroshi.com"

# OAuth clients, grants and tokens (tokens and codes stored only as hashes).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b055efabcf8249f2ad7ba2ea06cc772c"

# Bodies of the chat's text attachments (the board keeps only name, sizes and the
# first lines). Read only through the Worker (the signed-in owner, or the
# server's workers by MCP); the bucket has no public access. Created once at
# deploy time and given a 30-day expiry (see docs/local/design_chat-attachments_2026-11-22.md):
#   wrangler r2 bucket create many-iris-attachments
#   wrangler r2 bucket lifecycle add many-iris-attachments expire-30d att/ --expire-days 30
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "many-iris-attachments"

# Scripts and styles only. Pages are served by the Worker, which checks the key first.
[assets]
directory = "./public"

# The scheduled dispatcher polls the pile: work handed over without a
# destination gets one from the owner's order (src/route.ts), and work for
# devin goes to new Devin sessions (src/dispatch.ts).
[triggers]
crons = ["*/10 * * * *"]

# Workers Logs: invocations of the Worker and its Durable Objects are kept in
# the account, queryable in the dashboard and via the Observability MCP server.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "BOARD"
class_name = "BoardStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardStore"]

# Secrets (set with `wrangler secret put`, never in this file):
#   BOARD_WRITERS       key list of the writers (hashes only)
#   BOARD_STATUS_ONLY   optional status-only registration (#50):
#                       {"schema_version":1,"status_only":[{"project","actor"}]}
#                       — a project may run only as its registered taker and
#                       reports the fixed status words 状態：着手/作業中/要確認/完了
#   ACCESS_TEAM_DOMAIN  https://<team>.cloudflareaccess.com
#   ACCESS_AUD          Application Audience (AUD) tag of the Access application
#   BOARD_OWNERS        comma-separated emails allowed to read the page
#   DEVIN_API_KEY       Devin API key the dispatcher spawns sessions with
