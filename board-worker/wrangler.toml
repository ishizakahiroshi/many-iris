name = "many-iris-board"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Fetches of OAuth client metadata documents (CIMD) go only to public addresses.
compatibility_flags = ["global_fetch_strictly_public"]
# Reachable only through the custom domain added at deploy time (no workers.dev, no preview URLs).
workers_dev = false
preview_urls = false
# Custom domain: Cloudflare adds the DNS record and the certificate.
routes = [{ pattern = "iris.ishizakahiroshi.com", custom_domain = true }]

[build]
command = "node scripts/sync-web.mjs"

# The board's public origin: the OAuth issuer, and with /board/mcp the protected resource.
[vars]
BOARD_PUBLIC_ORIGIN = "https://iris.ishizakahiroshi.com"

# OAuth clients, grants and tokens (tokens and codes stored only as hashes).
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "b055efabcf8249f2ad7ba2ea06cc772c"

# Scripts and styles only. Pages are served by the Worker, which checks the key first.
[assets]
directory = "./public"

# The scheduled dispatcher polls the pile and hands requested work to new
# Devin sessions (see the scheduled handler in src/index.ts).
[triggers]
crons = ["*/10 * * * *"]

[[durable_objects.bindings]]
name = "BOARD"
class_name = "BoardStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BoardStore"]

# Secrets (set with `wrangler secret put`, never in this file):
#   BOARD_WRITERS       key list of the writers (hashes only)
#   ACCESS_TEAM_DOMAIN  https://<team>.cloudflareaccess.com
#   ACCESS_AUD          Application Audience (AUD) tag of the Access application
#   BOARD_OWNERS        comma-separated emails allowed to read the page
#   DEVIN_API_KEY       Devin API key the dispatcher spawns sessions with
